name: Weekly listings refresh (Idealista via Apify)

on:
  schedule:
    - cron: "17 2 * * 1"     # Mondays 02:17 UTC (03:17 Madrid)
  workflow_dispatch: {}       # "Run workflow" button for a manual refresh

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 200
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy pyarrow pyproj shapely geopandas requests
      - name: Scrape and clean
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
        run: python scripts/refresh_listings.py
      - name: Commit new listings
        run: |
          git config user.name "seize-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/app/listings.parquet data/app/listings_log.json
          git diff --cached --quiet && echo "no change" || git commit -m "Weekly listings refresh $(date -u +%F)"
          git push
